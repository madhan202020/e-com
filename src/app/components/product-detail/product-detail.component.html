<div *ngIf="product" class="product-detail mx-auto pb-16 p-6 bg-gradient-to-br from-white to-blue-50 shadow-2xl rounded-2xl w-full">

  <!-- Back Button -->
  <button
    type="button"
    (click)="goBack()"
    class="mb-6 flex items-center text-blue-600 hover:text-blue-800 transition font-medium"
  >
    <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" stroke-width="2"
         viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
    </svg>
    Back to Products
  </button>

  <!-- Main Layout -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
    
    <!-- Product Image Section -->
<div class="col-span-2">
  <div class="flex gap-4 items-start">
    <!-- Sub Images (Thumbnails) Vertical -->
    <div class="flex flex-col gap-4 h-[450px] overflow-x-hidden">
      <img
        *ngFor="let img of product.subImages"
        [src]="img"
        (click)="selectedImage = img"
        class="h-20 w-20 object-cover rounded-lg border-2 cursor-pointer transition-transform duration-300 hover:scale-110"
        [ngClass]="{
          'border-blue-500 ring-2 ring-blue-400': selectedImage === img,
          'border-transparent': selectedImage !== img
        }"
      />
    </div>

    <!-- Main Image -->
    <div class="relative bg-white rounded-xl p-4 shadow w-full">
      <img
        [src]="selectedImage || product.image"
        alt="{{ product.name }}"
        class="w-full h-[450px] object-contain rounded-xl transition-transform duration-500 ease-in-out hover:scale-105"
      />
    </div>
  </div>
</div>


    <!-- Product Info Section -->
    <div class="flex flex-col justify-between">
      <div>
        <h2 class="text-4xl font-extrabold text-gray-800 mb-2">{{ product.name }}</h2>
        <p class="text-gray-600 mb-4 leading-relaxed">{{ product.description }}</p>
        <div class="text-2xl font-bold text-green-600">{{ product.price | currency:'INR':'symbol' }}</div>
        Details...
      </div>

      <div class="mt-6 flex flex-col gap-3">
        <!-- Add to Cart Button -->
        <button
          class="bg-gradient-to-r from-blue-500 to-blue-700 text-white py-2 px-5 rounded-xl font-semibold shadow hover:scale-105 transition"
          (click)="addToCart(product)"
          [disabled]="!product"
        >
          Add to Cart
        </button>

        <!-- Wishlist Button -->
        <button
          (click)="toggleWishlist(); addToWishlist(product)"
          class="flex items-center justify-center gap-2 px-5 py-2 rounded-xl font-medium text-gray-700 bg-gray-200 shadow hover:bg-pink-100 hover:text-red-500 transition"
        >
          <svg xmlns="http://www.w3.org/2000/svg"
               class="h-5 w-5 transition"
               [class.fill-red-500]="likedProducts"
               [class.fill-none]="!likedProducts"
               viewBox="0 0 24 24"
               stroke="currentColor"
               stroke-width="2">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 
              2 6 4 4 6.5 4c1.74 0 3.41.81 4.5 2.09C12.09 4.81 
              13.76 4 15.5 4 18 4 20 6 20 8.5c0 
              3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          <span>{{ likedProducts ? 'Wishlisted' : 'Wishlist' }}</span>
        </button>
      </div>
    </div>
  </div>
</div>
