<div class="w-full px-4 py-10 bg-gray-100 text-center">
  <h2 class="text-2xl font-semibold tracking-wide mb-8">{{ title }}</h2>

  <p-carousel
    [value]="products"
    [numVisible]="4"
    [numScroll]="1"
    [responsiveOptions]="[
      { breakpoint: '1024px', numVisible: 3, numScroll: 1 },
      { breakpoint: '768px', numVisible: 1, numScroll: 1 }
    ]"
    [circular]="true"
    [autoplayInterval]="null"
    [showIndicators]="false"
    [showNavigators]="true"
  >
   <ng-template pTemplate="item" let-product>
  <div class="px-2">
    <!-- Group for hover behavior -->
    <div class="group bg-white rounded-lg shadow-md overflow-hidden">
      <div class="relative">
        <!-- Product Image -->
        <img
          [src]="product.image"
          alt="{{ product.name }}"
          class="w-full h-[420px] object-cover transition-transform duration-300 group-hover:scale-105"
        />

        <!-- Icons on hover -->
        <div class="absolute top-2 right-2 flex flex-col space-y-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
          <!-- Heart Icon -->
          <button
            class="bg-white w-8 h-8 rounded-full shadow flex items-center justify-center transition-transform duration-300 hover:scale-110 pointer-events-auto"
          >
            <i class="fas fa-heart text-red-500 text-base text-[14px]"></i>
          </button>

          <!-- Cart Icon -->
          <button
          (click)="addToCart(product)"
            class="bg-white w-8 h-8 rounded-full shadow flex items-center justify-center transition-transform duration-300 hover:scale-110 pointer-events-auto"
          >
            <i class="fas fa-shopping-cart text-gray-700 text-base text-[14px]"></i>
          </button>
        </div>
      </div>

      <!-- Product Info -->
      <div class="p-4 text-left">
        <h3 class="text-sm font-medium mb-2">{{ product.name }}</h3>
        <p class="text-gray-600 text-sm font-semibold">Rs. {{ product.price }}</p>
      </div>
    </div>
  </div>
</ng-template>


  </p-carousel>

  <div class="mt-6">
    <button (click)="viewAll()" class="bg-black text-white px-6 py-2 text-sm tracking-wide hover:bg-gray-800">
      VIEW ALL
    </button>
  </div>
</div>
