<div class="w-full px-4 py-10 bg-gray-100 text-center ">
  <h2 class="text-2xl font-semibold tracking-wide mb-8">{{ title }}</h2>

  <p-carousel
    [value]="products"
    [numVisible]="4"
    [numScroll]="1"
    [responsiveOptions]="[
      { breakpoint: '1024px', numVisible: 3, numScroll: 1 },
      { breakpoint: '768px', numVisible: 1, numScroll: 1 }
    ]"
    [circular]="true"
    [autoplayInterval]="null"
    [showIndicators]="false"
    [showNavigators]="true"
  >
   <ng-template pTemplate="item" let-product>
  <div class="px-2 pb-7">
    <!-- Group for hover behavior -->
    <div class="group h-[420px] pb-2 bg-white rounded-lg shadow-md overflow-hidden">
      <div class="relative "  >
        <!-- Product Image -->
        <img
          [src]="product.image"
          alt="{{ product.name }}"
          class="w-full h-[260px] object-cover transition-transform duration-300 group-hover:scale-105"
        />

        <!-- Icons on hover -->
        <div class="absolute top-2 right-2 flex flex-col space-y-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
          <!-- Heart Icon -->
          <button
            class="bg-white w-8 h-8 rounded-full shadow flex items-center justify-center transition-transform duration-300 hover:scale-110 pointer-events-auto"
          >
            <i class="fas fa-heart text-red-500 text-base text-[14px]"></i>
          </button>

          <!-- Cart Icon -->
          <button
          (click)="addToCart(product)"
            class="bg-white w-8 h-8 rounded-full shadow flex items-center justify-center transition-transform duration-300 hover:scale-110 pointer-events-auto"
          >
            <i class="fas fa-shopping-cart text-gray-700 text-base text-[14px]"></i>
          </button>
        </div>
      </div>

      <!-- Product Info -->
     <div (click)="prodectDetailsView(product)" class="p-4 hover:cursor-pointer text-left duration-300 bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow h-[209px] flex flex-col relative overflow-hidden">
  <!-- Offer Ribbon -->
  <!-- <div *ngIf="product.offer" class="absolute -right-8 -top-2 bg-red-500 text-white text-xs font-bold px-8 py-1 transform rotate-45 z-10 shadow-md">
    {{product.offer}} OFF!
  </div> -->

  <!-- Product Name -->
  <h3 class="text-base font-semibold mb-1 text-gray-800 line-clamp-2 min-h-[2.5rem]">
    {{ product.name }}
  </h3>
  
  <!-- Rating and Price -->
  <div class="flex justify-between items-center mb-1">
    <div class="flex items-center">
      <ng-container *ngFor="let star of [1,2,3,4,5]; let i = index">
        <svg *ngIf="i < product.rating" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-amber-500 fill-current" viewBox="0 0 20 20">
          <path d="M10 15l-5.878 3.09 1.122-6.545L.488 6.91l6.564-.955L10 0l2.948 5.955 6.564.955-4.756 4.635 1.122 6.545z" />
        </svg>
        <svg *ngIf="i >= product.rating" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-300 fill-current" viewBox="0 0 20 20">
          <path d="M10 15l-5.878 3.09 1.122-6.545L.488 6.91l6.564-.955L10 0l2.948 5.955 6.564.955-4.756 4.635 1.122 6.545z" />
        </svg>
      </ng-container>
      <span class="ml-1 text-xs text-gray-500">({{ product.rating }})</span>
    </div>
    
    <!-- Price with Offer Styling -->
    <div class="flex flex-col items-end">
      <p *ngIf="product.originalPrice" class="text-xs text-gray-400 line-through">
        Rs. {{ product.originalPrice | number }}
      </p>
      <p class="text-gray-800 font-bold text-[11px] bg-amber-50 px-2 py-0.5 rounded">
        Rs. {{ product.price | number }}
        <span *ngIf="product.offer" class="text-red-500 ml-1">(Save {{ calculateDiscount(product.originalPrice, product.price) }}%)</span>
      </p>
    </div>
  </div>

  <!-- Description -->
  <p class="text-gray-600 text-xs mb-3 line-clamp-2 flex-grow">
    {{ product.shortDescription }}
  </p>

  <!-- Badges Container -->

</div>

    </div>
  </div>
</ng-template>


  </p-carousel>

  
    <button (click)="viewAll()" class="bg-black  text-white px-6 py-2 text-sm tracking-wide hover:bg-gray-800">
      VIEW ALL
    </button>
 
</div>
